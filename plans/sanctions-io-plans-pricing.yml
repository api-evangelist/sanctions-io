specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: sanctions.io
providerId: sanctions-io
created: '2026-07-11'
modified: '2026-07-11'
reconciled: false
tags:
- Anti-Money Laundering
- AML
- Sanctions Screening
- Compliance
- Plans
description: >-
  sanctions.io is priced on screening volume. Onboarding is self-serve - a
  7-day free trial (no credit card) issues a working API key with access to
  all API features. Published volume packages have included Small (5,000 API
  calls/screenings for $899), Medium (50,000 for $2,999), and Large (200,000
  for $5,999); packages renew automatically after twelve months or once the
  included API calls are consumed, whichever comes first. Custom Enterprise
  plans start at 25,000+ monthly screenings. Current pricing is quoted through
  the pricing calculator on the website (5,000 to 250,000+ screenings per
  year, 1-3 year terms, monthly credit card or annual invoicing), with
  watchlist scope (sanctions, PEP, adverse media, high-risk jurisdictions,
  custom lists) and monitoring frequency as configuration dimensions. The
  vendor states there are no hidden implementation fees.
notes: >-
  The tiered package numbers ($899 / $2,999 / $5,999) come from the
  sanctions.io help center pricing article; the website now funnels buyers
  through the pricing calculator for a custom proposal, so verify current
  rates there during reconciliation. The database exporter endpoint requires a
  specific plan subscription.
sources:
- https://help.sanctions.io/knowledge-base/pricing-plans
- https://www.sanctions.io/pricing-calculator
- https://www.sanctions.io/
- https://api-docs.sanctions.io/
plans:
- id: sanctions-io-free-trial
  name: Free Trial
  type: trial
  description: >-
    Self-serve 7-day free trial with no credit card required. Sign up at
    api.sanctions.io/users/signup and retrieve an API key from the dashboard;
    the key grants access to all API features during the trial period. A
    shared test token is also published in the docs, returning real but
    partial data for integration testing only.
  entries:
  - label: Trial Period
    name: trial_period
    type: trial
    metric: days
    limit: 7
    timeFrame: once
    geo: global
    unit: 1
    price: free
    userMultiplied: false
  elements:
  - name: Full API Feature Access
  - name: No Credit Card Required
  - name: Shared Test Token for Integration Testing
- id: sanctions-io-small
  name: Small
  type: prepaid
  description: >-
    Volume package with 5,000 API calls/screenings for $899. Renews
    automatically after twelve months or once the included calls are
    consumed, whichever comes first.
  entries:
  - label: Included Screenings
    name: small_screenings
    type: usage
    metric: screenings
    limit: 5000
    timeFrame: year
    geo: global
    unit: 1
    price: $899 per package of 5,000 screenings
    userMultiplied: false
  elements:
  - name: Screening API
  - name: Manual Screening Portal
- id: sanctions-io-medium
  name: Medium
  type: prepaid
  description: >-
    Volume package with 50,000 API calls/screenings for $2,999. Renews
    automatically after twelve months or once the included calls are
    consumed, whichever comes first.
  entries:
  - label: Included Screenings
    name: medium_screenings
    type: usage
    metric: screenings
    limit: 50000
    timeFrame: year
    geo: global
    unit: 1
    price: $2,999 per package of 50,000 screenings
    userMultiplied: false
  elements:
  - name: Screening API
  - name: Batch Screening
  - name: Manual Screening Portal
- id: sanctions-io-large
  name: Large
  type: prepaid
  description: >-
    Volume package with 200,000 API calls/screenings for $5,999. Renews
    automatically after twelve months or once the included calls are
    consumed, whichever comes first.
  entries:
  - label: Included Screenings
    name: large_screenings
    type: usage
    metric: screenings
    limit: 200000
    timeFrame: year
    geo: global
    unit: 1
    price: $5,999 per package of 200,000 screenings
    userMultiplied: false
  elements:
  - name: Screening API
  - name: Batch Screening
  - name: Continuous Monitoring
  - name: Manual Screening Portal
- id: sanctions-io-enterprise
  name: Enterprise / Custom
  type: enterprise
  description: >-
    Custom high-volume plans starting at 25,000+ monthly screenings, quoted
    through the pricing calculator or sales. Configuration dimensions include
    annual screening volume (up to 250,000+), monitored entity counts (100 to
    10,000+), monitoring frequency (once, quarterly, monthly), watchlist scope
    (global sanctions, PEP, adverse media, high-risk jurisdictions, custom
    lists), 1-3 year contract terms, and Salesforce/HubSpot integrations. The
    database exporter endpoint requires a specific plan subscription.
  entries:
  - label: Enterprise Agreement
    name: enterprise
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: custom quote (25,000+ monthly screenings minimum)
    userMultiplied: false
  elements:
  - name: Custom Volume Pricing
  - name: Continuous Monitoring at Scale
  - name: Adverse Media Screening
  - name: Database Export Access
  - name: Salesforce and HubSpot Integrations
