sources:
  - url: https://api-docs.sanctions.io/
    type: Documentation
    note: Postman-published API reference - Screening API v2.3, Monitoring API v3.1, base https://api.sanctions.io. All endpoints request/response REST; webhooks section covers outbound events only.
  - url: https://www.sanctions.io/
    type: Website
    note: Product overview - 75+ sanctions lists from 30+ jurisdictions, 1M+ PEP records, criminal watchlists, adverse media across 60,000+ news sources.
  - url: https://help.sanctions.io/
    type: Support
    note: Knowledge base with implementation guide, best practices for screening parameters, and pricing plan articles.
  - url: https://www.sanctions.io/pricing-calculator
    type: Pricing
    note: Volume-based pricing calculator (5,000 to 250,000+ screenings/year); custom proposal flow.
  - url: https://app.swaggerhub.com/apis-docs/Sanctions.IO/sanctions-io_api
    type: OpenAPI
    note: Vendor-maintained OpenAPI 3.0 definitions on SwaggerHub for API versions 1.x-2.1 (older than the current Postman docs, but confirms the REST-only shape and Accept-header versioning).
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. sanctions.io's public API is
    request/response REST (screening, batch, adverse media, sources, export,
    monitoring, account management) and its only push mechanism is outbound
    HTTPS webhooks to customer endpoints, which do not constitute a
    subscribable server-push API transport to model in AsyncAPI.
