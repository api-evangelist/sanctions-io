apis:
- aid: sanctions-io:sanctions-io-screening-api
  name: sanctions.io Screening API
  tags:
  - Sanctions Screening
  - AML
  - PEP Screening
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api-docs.sanctions.io/
  baseURL: https://api.sanctions.io
  properties:
  - url: https://api-docs.sanctions.io/
    type: Documentation
  - url: https://www.sanctions.io/solutions/screening-api
    type: ProductPage
  - url: openapi/sanctions-io-openapi.yml
    type: OpenAPI
  description: Real-time single screening via the search endpoint - query a name
    (individual, entity, vessel, or aircraft) against selected sanctions, PEP, and
    criminal watchlist sources and get back scored matches. Tune results with
    min_score confidence (0.8-1.0), data_source short codes, entity_type, country,
    date_of_birth, identifier, and name-match boosting. Average response time is
    around 500-600ms for transaction and onboarding use cases.
- aid: sanctions-io:sanctions-io-batch-screening-api
  name: sanctions.io Batch Screening API
  tags:
  - Batch Screening
  - AML
  - Compliance
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api-docs.sanctions.io/
  baseURL: https://api.sanctions.io
  properties:
  - url: https://api-docs.sanctions.io/
    type: Documentation
  - url: openapi/sanctions-io-openapi.yml
    type: OpenAPI
  description: Screen up to 10,000 names in a single API request for large-scale
    compliance checks such as periodic customer base audits, bulk vendor onboarding,
    or regulatory reporting. Create, list, retrieve, and delete batch screenings and
    fetch batch results; webhook events notify your systems when batch results are
    ready.
- aid: sanctions-io:sanctions-io-adverse-media-api
  name: sanctions.io Adverse Media API
  tags:
  - Adverse Media
  - Due Diligence
  - AML
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api-docs.sanctions.io/
  baseURL: https://api.sanctions.io
  properties:
  - url: https://api-docs.sanctions.io/
    type: Documentation
  - url: https://www.sanctions.io/data/adverse-media-screening
    type: ProductPage
  - url: openapi/sanctions-io-openapi.yml
    type: OpenAPI
  description: Search news articles related to specific individuals, entities, or
    subjects using custom keywords, drawing on 60,000+ global news sources for due
    diligence and AML compliance. Requires the version 3.0 Accept header; adverse
    media can also be included in batch screening and monitoring by passing the
    ADV-MEDIA data source short code.
- aid: sanctions-io:sanctions-io-data-sources-api
  name: sanctions.io Data Sources API
  tags:
  - Watchlists
  - Data Sources
  - Sanctions Lists
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api-docs.sanctions.io/
  baseURL: https://api.sanctions.io
  properties:
  - url: https://api-docs.sanctions.io/
    type: Documentation
  - url: openapi/sanctions-io-openapi.yml
    type: OpenAPI
  description: List all sanctions and watchlist sources available for screening -
    each with the short_name code used in the data_source screening parameter
