meters:
- name: screenings
  description: API calls/screenings consumed against the prepaid package (real-time searches and batch records).
  unit: screenings
  aggregation: sum
  dimensions:
  - account
  - endpoint
  - data_source
- name: monitored_entities
  description: Entities under continuous monitoring; monitoring frequency (once, quarterly, monthly) drives re-screening volume.
  unit: entities
  aggregation: max
  dimensions:
  - account
  - review_status
- name: batch_records
  description: Records submitted in batch screenings (up to 10,000 per request), consuming screening volume in bulk.
  unit: records
  aggregation: sum
  dimensions:
  - account
  - batch
- name: adverse_media_searches
  description: Adverse media keyword searches (version 3.0 endpoint, or ADV-MEDIA data source in batch/monitoring), scoped by plan.
  unit: searches
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track consumed screenings against package volume with GET /searches/count, and tag screenings with external_identifier so consumption maps to customers and workflows.
- name: Allocation
  description: Use external_identifier and per-team API tokens to attribute screening volume to internal cost centers and use cases (onboarding, transactions, periodic audits).
- name: Optimization
  description: Tune min_score and data_source scope to avoid re-screening noise, use batch screening for bulk jobs, right-size monitoring frequency per risk tier, and use webhooks instead of polling.
- name: Accountability
  description: Review volume consumption against the package before the twelve-month/consumption renewal triggers, and re-quote via the pricing calculator when volume patterns change.
