description: >-
  FinOps view of sanctions.io spend. Cost is driven by screening volume:
  prepaid packages bundle a number of API calls/screenings (published tiers
  have included 5,000 for $899, 50,000 for $2,999, and 200,000 for $5,999)
  that renew after twelve months or once consumed, whichever comes first, and
  custom Enterprise plans start at 25,000+ monthly screenings. Real-time
  searches, batch screening records, and monitoring re-screens all consume
  screening volume; adverse media and database export access are scoped by
  plan. A 7-day free trial (no credit card) covers evaluation. The vendor
  states there are no hidden implementation fees, and pricing is quoted via a
  calculator based on annual volume, monitored entity counts, monitoring
  frequency, watchlist scope, and contract term.
notes: >-
  Per-unit rates beyond the published package tiers are not reconciled here;
  verify current numbers via the pricing calculator during reconciliation. The
  key cost lever is the consumption model - batch and monitoring configuration
  (screening frequency, data source scope, min_score tuning) determine how
  fast plan volume is consumed.
