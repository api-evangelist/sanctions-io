    - GET    https://api.sanctions.io/monitoring/result/{monitoring_result_id}/
    - PUT    https://api.sanctions.io/monitoring/result/{monitoring_result_id}/
    - GET    https://api.sanctions.io/tokens/
    - POST   https://api.sanctions.io/tokens/
    - DELETE https://api.sanctions.io/tokens/{token_key}
    - GET    https://api.sanctions.io/company/
