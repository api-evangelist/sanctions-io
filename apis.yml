  humanURL: https://api-docs.sanctions.io/
  baseURL: https://api.sanctions.io
  properties:
  - url: https://api-docs.sanctions.io/
    type: Documentation
  - url: openapi/sanctions-io-openapi.yml
    type: OpenAPI
  description: Manage the account around your screening integration - create,
    list, and delete API tokens, read and update company details and the company
    config (including registering webhook endpoints secured with SHA-256
    signatures), invite and manage users, view plan subscriptions, and count
    screenings performed.
