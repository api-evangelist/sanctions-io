name: sanctions.io
kind: company
description: sanctions.io is a sanctions, PEP, and criminal watchlist screening API
  for AML (anti-money laundering) compliance. The REST API (base https://api.sanctions.io)
  screens individuals, entities, vessels, and aircraft against 75+ sanctions lists
  from 30+ jurisdictions (OFAC SDN and Non-SDN, EU, UN, HM Treasury, and more), over
  one million politically exposed person (PEP) records, criminal watchlists like
  Interpol Red Notices and FBI Most Wanted, and adverse media from 60,000+ news
  sources. It supports real-time single screening, batch screening of up to 10,000
  records per request, continuous monitoring with webhook alerts, and a full
  sanctions database export, all behind Bearer token auth with Accept-header
  versioning and a self-serve 7-day free trial.
